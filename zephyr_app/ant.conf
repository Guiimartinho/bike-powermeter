# ANT build: tools/fw/fw.sh with ANT=1 adds the sdk-ant add-on and
# modules/ant_ncs33_compat as extra Zephyr modules and this file.
CONFIG_ANT=y
# Evaluation key of the ANT stack, for development only: a product on sale
# needs a commercial key in CONFIG_ANT_LICENSE_KEY (docs/05).
CONFIG_ANT_EVALUATION_KEY=y
# ant_plus_key_set(): the ANT+ network key comes from the add-on and never
# enters this repository.
CONFIG_ANT_KEY_MANAGER=y
CONFIG_ANT_CHANNEL_CONFIG=y
# The Bicycle Power profile of the add-on: pages 1, 16, 18, 80 and 81
CONFIG_ANT_BPWR=y
