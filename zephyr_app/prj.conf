# =============================================================================
# Bike power meter - Zephyr configuration (docs/04-arquitetura-firmware.md)
# =============================================================================

CONFIG_WARN_EXPERIMENTAL=n

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------
# main() loads the settings and starts the services
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_USE_MODULE=n
# The text commands print floats ($CFG,GET of the slope and of the curve)
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# -----------------------------------------------------------------------------
# Logging on the console
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n

# -----------------------------------------------------------------------------
# Buses (the devices come from the devicetree)
# -----------------------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# -----------------------------------------------------------------------------
# Events (docs/04, Eventos)
# -----------------------------------------------------------------------------
CONFIG_ZBUS=y
CONFIG_ZBUS_CHANNEL_NAME=y

# -----------------------------------------------------------------------------
# Threads
# -----------------------------------------------------------------------------
CONFIG_MULTITHREADING=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=10
CONFIG_THREAD_ANALYZER=n
CONFIG_THREAD_NAME=y

# -----------------------------------------------------------------------------
# Watchdog: one 4 s channel per service thread (six), behind the nRF WDT
# -----------------------------------------------------------------------------
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=4000
CONFIG_TASK_WDT_CHANNELS=8

# -----------------------------------------------------------------------------
# Power: System OFF for $SLEEP, the fuel gauge of the alias fuel-gauge0
# -----------------------------------------------------------------------------
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y
CONFIG_FUEL_GAUGE=y

# -----------------------------------------------------------------------------
# Sensors: the BMA400 (driver in modules/pm_drivers) and the TMP117 of the tree
# -----------------------------------------------------------------------------
CONFIG_SENSOR=y

# -----------------------------------------------------------------------------
# Bluetooth Low Energy: a peripheral with the Cycling Power Service
# -----------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_DEVICE_NAME="PM"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=12
# 0x0484 Cycling: Cycling Power Sensor
CONFIG_BT_DEVICE_APPEARANCE=1156
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="bike-powermeter"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="PM crank pod"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="0.1.0"
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="1"
CONFIG_BT_BAS=y
CONFIG_BT_SETTINGS=y
# The GATT callbacks of the configuration service parse a command line and
# answer it there: app_cmd_handle 248 B, pm_cmd_parse 360 and a float print
# (measured with CONFIG_STACK_USAGE, 2026-09-27), about 1,5 KB over the
# stack's own use
CONFIG_BT_RX_STACK_SIZE=4096
# One notification of the measurement and one of the vector per revolution
CONFIG_BT_L2CAP_TX_BUF_COUNT=6
CONFIG_BT_ATT_PREPARE_COUNT=2

# -----------------------------------------------------------------------------
# Settings (the nRF54LM20 targets switch to ZMS in their board .conf)
# -----------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# -----------------------------------------------------------------------------
# Faults and debug
# -----------------------------------------------------------------------------
CONFIG_CMSIS_DSP=n
CONFIG_DEBUG=n
CONFIG_DEBUG_OPTIMIZATIONS=n
CONFIG_ASSERT=n
CONFIG_FAULT_DUMP=1
# Log the fatal error and reboot (NCS lib/fatal_error) instead of halting
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_HWINFO=y

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n
