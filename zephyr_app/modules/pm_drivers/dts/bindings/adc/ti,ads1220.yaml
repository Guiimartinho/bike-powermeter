description: |
  Texas Instruments ADS1220 24-bit delta-sigma converter with PGA, driven by
  the API of drivers/adc/ads1220.h (not the Zephyr ADC API): the bridge of
  the power meter is read in continuous conversion on the DRDY edge, and the
  reference monitor and the power-down are part of the measurement cycle.
  Register fields from SBAS501D (revision May 2026), table 8-8.

compatible: "ti,ads1220"

include: spi-device.yaml

properties:
  drdy-gpios:
    type: phandle-array
    required: true
    description: |
      The DRDY pin, driven low by the converter when a result is ready
      (datasheet 8.5.1.3). Active low.

  gain:
    type: int
    default: 128
    enum: [1, 2, 4, 8, 16, 32, 64, 128]
    description: "PGA gain (CONFIG0 GAIN[2:0])."

  data-rate:
    type: int
    default: 175
    enum: [20, 45, 90, 175, 330, 600, 1000]
    description: "Data rate in normal mode, samples per second (CONFIG1 DR[2:0], table 8-12)."

  mux:
    type: int
    default: 0
    description: |
      Input multiplexer setting (CONFIG0 MUX[3:0], table 8-10): 0 is
      AINP = AIN0, AINN = AIN1, the bridge output of the power meter.

  vref:
    type: string
    default: "refp0"
    enum: ["internal", "refp0", "refp1", "avdd"]
    description: |
      Reference (CONFIG2 VREF[1:0]): the bridge excitation on REFP0/REFN0
      makes the measurement ratiometric.

  pga-bypass:
    type: boolean
    description: "Bypass the PGA (only gains 1, 2 and 4)."

  low-side-switch:
    type: boolean
    description: |
      Use the low-side power switch between AIN3/REFN1 and AVSS (CONFIG2
      PSW): it closes on START/SYNC and opens on POWERDOWN (8.3.9). The
      power meter switches the excitation with the TPS22916 instead.
