# Sysbuild of the zephyr_app (NCS v3.3.0).
#
# The Partition Manager is deprecated in NCS 3.3 in favour of the devicetree
# partitions. With it off, the flash layout of the nRF54LM20A targets is the
# one of nrf54lm20a_cpuapp_partition.dtsi: MCUboot in 64 KB at 0x0, two
# slots of 920 KB and the storage partition for the settings.
SB_CONFIG_PARTITION_MANAGER=n
