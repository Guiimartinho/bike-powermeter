# nRF54LM20 DK (nrf54lm20dk/nrf54lm20a/cpuapp), merged after prj.conf.
#
# The nRF54L non-volatile memory is RRAM: no erase, and Nordic recommends
# ZMS instead of NVS on it. The settings subsystem (bonds, the configuration
# blob) then uses the ZMS backend; the application code does not change.
CONFIG_NVS=n
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# --- Update over the air (DFU): mcumgr SMP over Bluetooth -------------------
#
# The numbers are the ones of the official smp_svr sample
# (zephyr/samples/subsys/mgmt/mcumgr/smp_svr/bt.conf), which splits one SMP
# packet into five Bluetooth writes of 498 bytes.
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
# img_mgmt.h pulls bootutil/image.h: the chain-loaded side of MCUboot
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
# The SMP service needs a bonded link, not an authenticated one. With
# BT_SMP on, Zephyr defaults this choice to _AUTHEN (security level 3),
# and the pod has no display and no keyboard: pairing is always Just
# Works, which stops at level 2, so an _AUTHEN characteristic could never
# be written and the update over BLE would be impossible. Measured on
# 2026-09-27 in the generated .config. Same reasoning as src/rf/ble_cfg.c.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# The hooks src/rf/dfu.c hangs on: progress for the status characteristic
# and the right to refuse an upload while the crank turns or the battery is low.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y

# --- USB: the serial of the commands ---------------------------------------
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
# the serial of the commands is not the console: it opens with the service
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
