# MCUboot image of the zephyr_app (sysbuild fragment, NCS v3.3.0).
#
# Without the Partition Manager the automatic sector count takes over and
# Kconfig warns that the SoC fragment's value was thrown away. The count is
# fixed here instead: the RRAM erases in 4096 B blocks and a slot holds
# 664 KB (the nRF54L15's own layout, which this board does not override), so
# an image takes at most 166 sectors.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256

# --- Serial recovery over the UART of the magnetic connector ---------------
#
# The pod has no button: at every boot MCUboot brings the UART up and waits
# this long for a recovery request (mcumgr over SMP), then boots the
# application. It is a UART and not a USB CDC ACM since 2026-09-28, because
# the nRF54L15 has no USB - the same two contacts of the magnetic connector
# that used to carry D+ and D- now carry TX and RX
# (hardware_powermeter/09-modulo-de-radio.md).
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=1000

# The bootloader's own console has to go. serial_adapter.c refuses to build
# with it on ("Zephyr UART console must be disabled if serial_adapter module
# is used"), and the reason is not a preference: recovery TAKES the UART
# over, and a console printing on the same pins would corrupt the SMP frames.
# This is the bootloader's image only - the application keeps its console on
# the same uart20, because by then MCUboot has handed it back.
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
