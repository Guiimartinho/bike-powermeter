# MCUboot image of the zephyr_app (sysbuild fragment, NCS v3.3.0).
#
# The SoC fragment of MCUboot for this part already sets
# CONFIG_BOOT_MAX_IMG_SECTORS=256
# (bootloader/mcuboot/boot/zephyr/socs/nrf54lm20a_cpuapp.conf), but without
# the Partition Manager the automatic count takes over and Kconfig warns
# that the value was thrown away. The count is fixed here instead: the RRAM
# erases in 4096 B blocks and a slot holds 904 KB (sysbuild/mcuboot.overlay),
# so an image takes at most 226 sectors.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n

# --- Serial recovery over the USB of the magnetic connector ----------------
#
# The pod has no button: at every boot MCUboot brings the USB up and waits
# this long for a recovery request on its CDC ACM port (mcumgr over SMP),
# then boots the application. On the nRF54LM20A the recovery uses the new
# USB device stack (Kconfig.serial_recovery selects it for this SoC).
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=1000
